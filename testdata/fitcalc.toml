# fitcalc project of the probe circuit. Paths are relative to this file;
# "fitcalc testdata" writes the report testdata/probe.md.

netlist = "probe.net"
parts   = ["probe.bom.csv", "parts.db.csv"] # the BOM first
mission = "mission.csv"

# Also possible, as the long flags:
